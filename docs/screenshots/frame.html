<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Daily frames</title>
    <style>
      html, body { margin: 0; }
      body { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
      iframe { border: 0; display: block; width: 340px; height: 560px; }

      /* single panel capture */
      .single iframe { position: absolute; left: 0; top: 0; }

      /* 1280x640 banner (also the right size for GitHub's social preview) */
      .banner { width: 1280px; height: 640px; background: #f6f4ee; display: flex; align-items: center; gap: 56px; padding: 0 64px; box-sizing: border-box; overflow: hidden; }
      .copy { flex: 1; color: #1f1e1c; }
      .copy img { width: 88px; height: 88px; image-rendering: pixelated; display: block; margin-bottom: 18px; }
      .copy h1 { font-size: 76px; font-weight: 700; margin: 0; letter-spacing: -2px; line-height: 1; }
      .copy p { font-size: 26px; color: #4a4945; margin: 18px 0 26px; line-height: 1.3; }
      .pills { display: flex; flex-wrap: wrap; gap: 8px; max-width: 470px; }
      .pills span { font-size: 15px; padding: 6px 12px; border-radius: 999px; background: #e3f2ec; color: #0f6e56; }
      .shots { display: flex; gap: 22px; align-items: flex-start; }
      .shots .card { border-radius: 14px; overflow: hidden; box-shadow: 0 18px 40px rgba(31, 30, 28, 0.18), 0 0 0 1px rgba(31, 30, 28, 0.08); }
      .shots .card.dark { margin-top: 40px; }
    </style>
  </head>
  <body>
    <script>
      const p = new URLSearchParams(location.search);
      const view = p.get("view") ?? "banner";
      const src = (q) => `/docs/screenshots/shot.html?${q}`;
      if (view === "banner") {
        document.body.innerHTML = `
          <div class="banner">
            <div class="copy">
              <img src="/src-tauri/icons/128x128.png" alt="" />
              <h1>Daily</h1>
              <p>Your day, one click away<br />in the Windows tray.</p>
              <div class="pills">
                <span>Recurring tasks</span><span>Progress bar</span><span>Heatmap</span>
                <span>Evening reminder</span><span>PNG export</span><span>Auto-updates</span><span>100% local</span>
              </div>
            </div>
            <div class="shots">
              <div class="card"><iframe src="${src("theme=light")}"></iframe></div>
              <div class="card dark"><iframe src="${src("theme=dark")}"></iframe></div>
            </div>
          </div>`;
      } else {
        document.body.className = "single";
        document.body.innerHTML = `<iframe src="${src(p.get("q") ?? "")}"></iframe>`;
      }
    </script>
  </body>
</html>
