[package]
name = "daily"
version = "0.1.0"
description = "Tray-resident daily task panel"
authors = ["jkdev"]
license = "MIT"
repository = "https://github.com/jkagullo/daily"
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash with the bin on Windows (cargo#8519)
name = "daily_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-autostart = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Size-focused release profile: https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
